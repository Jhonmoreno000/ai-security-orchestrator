version: '3.8'

networks:
  internal_net:
    driver: bridge
  target_net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: orchestrator_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orchestrator_db}
      POSTGRES_USER: ${POSTGRES_USER:-orchestrator_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator_pass_secure}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    container_name: orchestrator_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - internal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orchestrator_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-orchestrator_db}
      - POSTGRES_USER=${POSTGRES_USER:-orchestrator_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-orchestrator_pass_secure}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    networks:
      - internal_net
      - target_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orchestrator_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - internal_net

volumes:
  postgres_data:
